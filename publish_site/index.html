<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XCat 发布页</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --text: #eef3ff;
      --muted: #9fb0d0;
      --accent: #66d9ef;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1b2b52 0, transparent 36rem), var(--bg);
      color: var(--text);
    }
    .wrap {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
      display: grid;
      gap: 20px;
    }
    .hero, .panel {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(18,26,47,.96), rgba(24,34,59,.88));
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    .badge {
      width: fit-content;
      padding: 6px 10px;
      border: 1px solid rgba(102,217,239,.38);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(102,217,239,.08);
      font-size: 13px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 48px); }
    h2 { margin: 0 0 16px; font-size: 22px; }
    p { margin: 0; color: var(--muted); line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--accent);
      color: #06111f;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
    }
    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
    }
    .latest-name {
      margin-top: 14px;
      font-family: Consolas, "Cascadia Mono", monospace;
      color: var(--accent);
      word-break: break-all;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(102,217,239,.15);
      color: var(--accent);
      font-size: 12px;
      margin-left: 8px;
    }
    .mono {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
      word-break: break-all;
    }
    .empty { color: var(--muted); }
    footer { color: var(--muted); font-size: 13px; text-align: center; }
    @media (max-width: 720px) {
      .hero, .panel { padding: 20px; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255,255,255,.03);
      }
      td { border: none; padding: 6px 0; }
      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">XCat</div>
      <h1>XCat</h1>
      <p>解压后运行 xcat.exe。</p>
      <div class="actions">
        <a id="download" class="btn" href="#">下载最新版</a>
      </div>
      <div class="latest-name" id="latestName">读取中...</div>
    </section>

    <section class="panel">
      <h2>全部版本</h2>
      <div id="versionsWrap"><p class="empty">正在加载...</p></div>
    </section>

    <footer>Public: http://xcat.work:52080/ | Local: http://127.0.0.1:52080/ | Manifest: /update/latest.json</footer>
  </main>
  <script>
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    /** 页面只展示软件名，隐藏产品线敏感片段；下载路径仍用原 file。 */
    function displayName(name) {
      return String(name || "")
        .replace(/_for_twms/gi, "")
        .replace(/twms_/gi, "")
        .replace(/_twms/gi, "")
        .replace(/twms/gi, "xcat");
    }

    fetch("/versions.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        const versions = data.versions || [];
        const latest = versions.find(v => v.isLatest) || versions[0];
        if (latest) {
          document.getElementById("download").href = latest.file;
          document.getElementById("latestName").textContent = displayName(latest.name);
        } else {
          document.getElementById("download").style.display = "none";
          document.getElementById("latestName").textContent = "暂无发布包";
        }

        if (!versions.length) {
          document.getElementById("versionsWrap").innerHTML = '<p class="empty">暂无发布包</p>';
          return;
        }

        const rows = versions.map(v => `
          <tr>
            <td data-label="包名">
              <span class="mono">${esc(displayName(v.name))}</span>
              ${v.isLatest ? '<span class="tag">最新</span>' : ''}
            </td>
            <td data-label="发布时间">${esc(v.publishedAt || "-")}</td>
            <td data-label="大小">${esc(v.sizeText || "-")}</td>
            <td data-label="下载"><a class="btn secondary" href="${esc(v.file)}">下载</a></td>
          </tr>
        `).join("");

        document.getElementById("versionsWrap").innerHTML = `
          <table>
            <thead>
              <tr><th>包名</th><th>发布时间</th><th>大小</th><th>下载</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      })
      .catch(() => {
        document.getElementById("latestName").textContent = "加载失败";
        document.getElementById("versionsWrap").innerHTML = '<p class="empty">加载失败</p>';
      });
  </script>
</body>
</html>
